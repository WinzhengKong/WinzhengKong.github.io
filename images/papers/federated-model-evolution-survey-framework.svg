<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Interdependencies among federated model evolution problems</title>
  <desc id="desc">Federated domain adaptation, federated continual learning, and federated unlearning form a cycle: adaptation triggers forgetting, continual learning complicates unlearning, and unlearning disrupts adaptation.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8fca"/><stop offset="1" stop-color="#2f6fa9"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aaea8"/><stop offset="1" stop-color="#347f7a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7b85c"/><stop offset="1" stop-color="#c98a2c"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#66717d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#18334d" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="700" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#223548">Federated Model Evolution in Open Environments</text>
  <text x="700" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#617181">Interdependencies among the three core problems</text>
  <path d="M545 285 C465 338, 411 418, 393 501" fill="none" stroke="#66717d" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M514 610 C643 676, 768 676, 894 610" fill="none" stroke="#66717d" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M1009 501 C991 410, 934 330, 850 281" fill="none" stroke="#66717d" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="188" y="330" width="270" height="76" rx="16" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/>
  <text x="323" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#455564">Adaptation triggers</text><text x="323" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#455564">forgetting</text>
  <rect x="565" y="641" width="270" height="94" rx="16" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/>
  <text x="700" y="673" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#455564">Continual learning</text><text x="700" y="701" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#455564">complicates unlearning</text>
  <rect x="944" y="330" width="270" height="76" rx="16" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/>
  <text x="1079" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#455564">Unlearning disrupts</text><text x="1079" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#455564">adaptation</text>
  <g filter="url(#shadow)"><circle cx="700" cy="257" r="151" fill="url(#blue)"/><circle cx="350" cy="560" r="151" fill="url(#teal)"/><circle cx="1050" cy="560" r="151" fill="url(#gold)"/></g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="700" y="223" font-size="29">Federated</text><text x="700" y="260" font-size="29">Domain</text><text x="700" y="297" font-size="29">Adaptation</text>
    <text x="350" y="526" font-size="29">Federated</text><text x="350" y="563" font-size="29">Continual</text><text x="350" y="600" font-size="29">Learning</text>
    <text x="1050" y="544" font-size="29">Federated</text><text x="1050" y="581" font-size="29">Unlearning</text>
  </g>
</svg>
